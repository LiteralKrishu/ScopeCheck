<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172720">
  <title>ScopeCheck — Project workspace</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Workspace navigation"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main id="main" tabindex="-1">
        <p class="loading">Opening your workspace…</p>
      </main>
      <footer class="footer"><span>ScopeCheck / Workspace</span><span>Project records stay in this browser.</span></footer>
    </div>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="project-dialog" aria-labelledby="dialog-title">
    <form id="project-form">
      <p class="eyebrow">Workspace</p>
      <h2 id="dialog-title">New project</h2>
      <p class="muted">Start with the name on your agreement.</p>
      <label>Project name<input name="name" maxlength="80" required autofocus placeholder="Website redesign"></label>
      <label>Client <span class="optional">Optional</span><input name="client" maxlength="80" placeholder="Client or company name"></label>
      <p class="form-error" aria-live="polite" hidden></p>
      <div class="actions dialog-actions">
        <button type="button" class="button secondary" data-action="close-dialog">Cancel</button>
        <button type="submit" class="button primary">Create project</button>
      </div>
    </form>
  </dialog>
</body>
</html>
